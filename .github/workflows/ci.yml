name: CI

# The root README's tech-stack table and ROADMAP.md's Phase 1 checklist
# both described this as already built ("CI: lint (ruff) + test on every
# push/PR, for each service independently"), but no .github/workflows
# directory actually existed in this repo until this pass -- a real
# documentation/reality gap, not a deliberate omission, found while
# auditing the repo for the Terraform/Ansible/GitOps work and fixed here
# alongside it rather than left inconsistent. Every step below calls
# the exact same Makefile targets (`make test`, `make lint`) a person
# would run locally -- this workflow doesn't duplicate their logic.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for the default GITHUB_TOKEN: every job below only reads the
# repo. The one job that needs more (publish) declares it itself.
permissions:
  contents: read

# A newer push to the same ref supersedes the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth
          - gateway
          - deployment
          - incident
          - alert
          - aiops
          - analytics
          - notification
          - audit
          - infrastructure
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: pytest -q

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        # Pinned so a new ruff release can't turn a green main red overnight;
        # Dependabot does not track this, bump it deliberately.
        run: pip install ruff==0.16.9

      - name: Run ruff
        run: ruff check services/

  frontend:
    name: frontend (lint, test, audit, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Type-check
        working-directory: frontend
        run: pnpm run lint

      - name: Unit and component tests
        working-directory: frontend
        run: pnpm run test

      - name: Audit dependencies
        working-directory: frontend
        run: pnpm audit --audit-level=moderate

      - name: Build the operations console
        working-directory: frontend
        run: pnpm run build

  # Named in the original design doc's security controls ("image
  # scanning") and, like the rest of this platform's honesty about gaps,
  # simply wasn't built until this pass. Builds each service's REAL
  # Dockerfile (not a stripped-down stand-in) and scans the actual image
  # that would be deployed -- catches CVEs in the base image and every
  # OS/language package this repo's own Dockerfiles pull in, including
  # the ones services/infrastructure/Dockerfile installs itself
  # (terraform, ansible, kubectl, helm, the AWS SSM plugin).
  image-scan:
    name: image scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - auth
          - deployment
          - incident
          - alert
          - aiops
          - analytics
          - notification
          - audit
          - infrastructure
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t icop-${{ matrix.service }}:ci services/${{ matrix.service }}

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: icop-${{ matrix.service }}:ci
          format: table
          # CRITICAL/HIGH fail the build; MEDIUM/LOW are reported but
          # don't block -- the common, pragmatic threshold real teams use
          # rather than either ignoring severity entirely or blocking on
          # every low-severity advisory in a base image maintainers
          # haven't backported yet.
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  # Known-vulnerable pinned dependencies. Every service pins exact versions, so
  # nothing upgrades itself; this is what tells you a pin has gone bad.
  dependency-audit:
    name: dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit every service's requirements
        run: |
          status=0
          for f in services/*/requirements.txt; do
            echo "::group::$f"
            pip-audit -r "$f" --disable-pip --no-deps || status=1
            echo "::endgroup::"
          done
          exit $status

  # Committed secrets / credentials anywhere in the tree.
  secret-scan:
    name: secret scan (trivy fs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan repository for secrets
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: secret
          exit-code: "1"

  # Real `helm lint` + `helm template` (the in-repo _approximate_render_check.py
  # is only a stand-in for when no helm binary is available). Renders the chart
  # with every per-service values file (environment first, service second --
  # the same precedence the ApplicationSets use) so a bad override fails here, not in ArgoCD.
  helm:
    name: helm lint + template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: helm lint
        run: helm lint infra/helm/service-chart

      - name: helm template with every gitops values file
        run: |
          for f in gitops/values/services/*.yaml; do
            for env in staging production; do
              echo "::group::$(basename "$f") ($env)"
              helm template "icop-$env-$(basename "$f" .yaml)" infra/helm/service-chart \
                -f "gitops/values/environments/$env.yaml" -f "$f" > /dev/null
              echo "::endgroup::"
            done
          done

  # terraform fmt/validate and an Ansible syntax-check both need network
  # access (to download the AWS provider plugin and the amazon.aws
  # collection respectively) that this repo's own build sandbox never had
  # -- see terraform/README.md and ansible/README.md for exactly what was
  # checked offline instead. GitHub's runners DO have real network access,
  # so this job is real and does the actual validation neither of those
  # READMEs could -- unlike test/lint above, it was never run even once,
  # since running it requires pushing to a real GitHub remote this repo
  # doesn't have yet (see gitops/README.md's bootstrap steps).
  validate-infra:
    name: validate terraform + ansible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: terraform fmt check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: terraform init + validate (staging)
        working-directory: terraform/environments/staging
        run: |
          terraform init -backend=false
          terraform validate

      - name: terraform init + validate (production)
        working-directory: terraform/environments/production
        run: |
          terraform init -backend=false
          terraform validate

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible + collections
        run: |
          pip install "ansible-core>=2.17,<2.19"
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: ansible-playbook syntax check
        working-directory: ansible
        run: ansible-playbook -i inventory/ci-static.ini playbooks/site.yml --syntax-check

  # Publish one image per service to GitHub Container Registry, tagged with the
  # commit SHA. Main only, and only after every check above is green.
  # Nothing consumes these yet: gitops/values/services/*.yaml still reference
  # `icop-<service>:latest`; point them at ghcr.io/<owner>/icop-<service>:<sha>
  # (or let Argo CD Image Updater do it) once you want GitOps to deploy them.
  publish:
    name: publish (${{ matrix.service }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, lint, image-scan, dependency-audit, secret-scan, helm, frontend, validate-infra]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - auth
          - deployment
          - incident
          - alert
          - aiops
          - analytics
          - notification
          - audit
          - infrastructure
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/icop-${{ matrix.service }}:${{ github.sha }}
