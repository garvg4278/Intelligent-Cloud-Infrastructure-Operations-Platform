[defaults]
inventory       = inventory/aws_ec2.yml
roles_path      = roles
host_key_checking = False
retry_files_enabled = False
stdout_callback = yaml
interpreter_python = auto_silent
# EKS nodes have no SSH server exposed at all (see ../terraform/modules/eks
# -- no ingress on port 22 anywhere); every connection in this repo goes
# over AWS Systems Manager instead. host_key_checking/SSH-specific settings
# above are harmless defaults, not load-bearing for how this actually connects.

[inventory]
enable_plugins = amazon.aws.aws_ec2
