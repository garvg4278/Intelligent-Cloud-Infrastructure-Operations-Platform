---
node_exporter_version: "1.12.1"
node_exporter_user: node_exporter
node_exporter_port: 9100
node_exporter_arch: linux-amd64   # matches this repo's node instance types (t3.*/m6i.* -- all x86_64); change to linux-arm64 if node_instance_types ever moves to Graviton (t4g.*/m6g.*)
node_exporter_download_url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.{{ node_exporter_arch }}.tar.gz"
node_exporter_install_dir: /usr/local/bin
