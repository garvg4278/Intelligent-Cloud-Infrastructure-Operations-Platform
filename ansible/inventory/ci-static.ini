# A real, checked-in static inventory used ONLY by CI's
# `ansible-playbook --syntax-check` step (see .github/workflows/ci.yml).
#
# Not a stand-in for inventory/aws_ec2.yml.example in real use -- the
# amazon.aws.aws_ec2 DYNAMIC inventory plugin calls the AWS API
# (ec2:DescribeInstances) to build its host list the moment Ansible loads
# it, before a playbook ever runs -- which happens even for
# --syntax-check, since inventory loading and playbook parsing are
# separate phases. That call would fail outright without real AWS
# credentials, which CI intentionally doesn't have configured (no AWS
# account is wired to this repo's CI -- see terraform/README.md). A
# static file with one placeholder host sidesteps that: syntax-check
# only needs SOME inventory that satisfies the playbooks' `hosts:
# k8s_nodes` pattern, never a reachable one.
[k8s_nodes]
ci-placeholder ansible_connection=local ansible_host=localhost
