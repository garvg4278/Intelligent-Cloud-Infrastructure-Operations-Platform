image:
  repository: icop-deployment
  tag: latest # see gateway.yaml's comment on this -- same caveat, every service

envFromSecret: icop-deployment-secrets

# IRSA binding lives on deployment-worker.yaml, not here -- the stateless
# API pod only accepts HTTP requests and enqueues Celery tasks, it has no
# plausible reason to need direct AWS access. It's the worker that
# actually shells out to helm/kubectl and would be where artifact
# upload/download eventually gets built -- see
# terraform/modules/irsa/README.md and gitops/values/services/deployment-worker.yaml.

# ---- Pod hardening override (see infra/helm/service-chart/values.yaml) ----
# This image still runs as root: it shells out to helm/kubectl, which write
# caches/state under $HOME and the working directory. Non-root + read-only
# rootfs for it needs testing against a real cluster; tracked in ROADMAP.md.
# Every other service uses the chart's restricted defaults.
podSecurityContext: null   # null (not {}): Helm merges maps with the chart defaults, only null removes a key
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]
tmpVolume:
  enabled: false
