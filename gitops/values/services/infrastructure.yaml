# Identity for the "infrastructure" ICOP service -- deployed from the one shared
# chart at infra/helm/service-chart with this file layered on top of
# values/environments/<env>.yaml (see gitops/root/resources/).
image:
  repository: icop-infrastructure
  tag: latest # replace with a real image digest/tag once a CI pipeline builds and pushes one -- "latest" is a local-dev convenience, not a real deployment practice (see this directory's README)

# Every ICOP service reads its config from env vars (see
# services/infrastructure/app/config.py) -- DATABASE_URL, REDIS_URL, JWT secrets,
# etc. all need to exist in this Secret before this Application will
# actually come up healthy. Create it out-of-band (kubectl create secret,
# or an External Secrets Operator synced from the Secrets Manager entry
# terraform/modules/rds's secret_arn output points at) -- this chart
# intentionally never manages secret *contents*, only references a name.
envFromSecret: icop-infrastructure-secrets

# ---- Pod hardening override (see infra/helm/service-chart/values.yaml) ----
# This image still runs as root: it shells out to terraform/ansible, which write
# caches/state under $HOME and the working directory. Non-root + read-only
# rootfs for it needs testing against a real AWS account; tracked in ROADMAP.md.
# Every other service uses the chart's restricted defaults.
podSecurityContext: null   # null (not {}): Helm merges maps with the chart defaults, only null removes a key
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]
tmpVolume:
  enabled: false
