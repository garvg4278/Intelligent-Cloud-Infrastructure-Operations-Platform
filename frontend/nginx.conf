server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 1m;

  error_page 404 /404.html;

  # Hashed build output: cache forever, and a missing file is a real 404
  # (not the SPA shell, which would be served as "JavaScript" and fail confusingly).
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Runtime config + the pre-paint theme script must never be stale.
  location = /config.json {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }
  location = /theme-init.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # Other static files that exist (favicon, robots, 404 page): serve or 404, never the SPA shell.
  location ~* \.(?:svg|ico|png|txt|css|js|map|html)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location /api/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    proxy_pass http://gateway:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Appends the address nginx actually saw to whatever the client sent. The
    # gateway (TRUST_PROXY_HEADERS) takes the RIGHTMOST entry, which is this one.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s; # the AI route can legitimately take a while
  }

  # Everything else is a client-side route; the app renders its own 404 for unknown ones.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    try_files $uri /index.html;
  }
}
