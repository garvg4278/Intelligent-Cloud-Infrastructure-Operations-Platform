# Included by every location that sets its own add_header (nginx does not
# inherit add_header into a location that declares any of its own).
#
# CSP: scripts/styles/fonts/images only from this origin, no inline script, no
# eval, no plugins, no framing, form posts and base URI pinned to self. The app
# is built to need nothing more (theme-init.js is a file, styles are a bundle,
# React sets style properties through the CSSOM which CSP allows).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# HSTS is deliberately absent: this container speaks plain HTTP behind whatever
# terminates TLS (ALB / ingress), which is where Strict-Transport-Security belongs.
