[tool.ruff]
line-length = 110
# See services/auth/pyproject.toml for why alembic/versions is excluded.
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "BLE"]
ignore = [
    # See services/auth/pyproject.toml -- same reasoning, FastAPI's
    # Depends(...) pattern in argument defaults is the framework's real API.
    "B008",
    # StrEnum changes str(member) from "Role.admin" to "admin"; these enums back
    # database columns and API payloads, so a style rule is not worth that risk.
    "UP042",
]
